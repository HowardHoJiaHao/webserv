prefix /home/hwai-keo/webserv;

server
{
	listen 127.0.0.1:8080;
	root ./www1;
	index index.html;
	client_max_body_size 1000000;
	error_page 200 /200.html;
	error_page 201 /201.html;
	error_page 204 /204.html;
	error_page 400 /400.html;
	error_page 403 /403.html;
	error_page 404 /404.html;
	error_page 405 /405.html;
	error_page 408 /408.html;
	error_page 413 /413.html;
	error_page 500 /500.html;
	error_page 504 /504.html;

	location /
	{
		methods GET POST DELETE;
		autoindex on;
	}

	location /haha
	{
		methods GET POST;
		index upload.html;
		autoindex on;
		root	./www1;
	}

	location /cgi-bin
	{
		allow_methods GET POST;
		cgi_enabled on;
		cgi_ext .py .pl;
		autoindex off;
	}

	location /Upload
	{
		methods POST DELETE;
		upload_enabled on;
		upload_path ./uploads;
		root ./uploads;
		autoindex off;
	}
}

server
{
	listen 127.0.0.1:8081;
	root ./www2;
	index home.html;
	client_max_body_size 1000000;
	error_page 404 /404.html;

	location /
	{
		methods GET;
		autoindex on;
	}

	location /42kl
	{
		methods GET;
		return 301 https://42kl.edu.my/;
	}
}

server
{
	location /
	{
		methods GET;
		autoindex off;
	}
}
