prefix /home/hwai-keo/webserv;

server
{
	listen 127.0.0.1:8080;

	root ./www1;
	index index.html;
	client_max_body_size 1000000;
	error_page 404 /404.html;
	error_page 500 /500.html;

	location /
	{
		methods GET POST;
		autoindex off;
	}

	location /cgi-bin
	{
		methods GET POST;
		cgi_enabled on;
		cgi_ext .py .pl;
		autoindex off;
	}

	location /Upload
	{
		methods POST;
		upload_enable on;
		upload_path ./uploads;
		autoindex off;
	}
}

server
{
	listen 127.0.0.1:8081;

	root ./www2;
	index home.html;
	client_max_body_size 1000000;
	error_page 404 /404.html;

	location /
	{
		methods GET;
		autoindex on;
	}

	location /42kl
	{
		return 301 https://42kl.edu.my/;
	}
}
