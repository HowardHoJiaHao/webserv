# 42 webserv evaluation config (manual-demo friendly)
# Run from repo root:
#   ./webserv testing/eval_config.conf
#
# Notes about this project's behavior:
# - error_page paths are concatenated like: server_root + "/404.html"
#   so the configured error_page target should start with '/'.

prefix ./;

# ---------------------------------------------------------------------------
# Server A (Website A): 127.0.0.1:8090
# Demonstrates:
# - index on directory
# - custom 404 page
# - per-location root+index override (/site2)
# - client_max_body_size via /Upload
# - per-location allowed methods (/delete)
# ---------------------------------------------------------------------------
server
{
	listen 127.0.0.1:8090;

	root ./www1;
	index index.html;

	# Intentionally small so you can demo 413 quickly.
	# Use curl bodies of 9 bytes (OK) and 11 bytes (too large).
	client_max_body_size 10;

	error_page 404 /404.html;
	error_page 500 /500.html;

	location /
	{
		methods GET;
		autoindex off;
	}

	# Route to a different directory + override index
	# GET /site2/ should return www2/home.html
	location /site2
	{
		methods GET;
		root ./www2;
		index home.html;
		autoindex off;
	}

	# Upload endpoint
	# (Your engine currently treats POST as "upload" only when upload_enabled is on)
	location /Upload
	{
		methods POST;
		upload_enabled on;
		upload_path ./uploads_eval;
		autoindex off;
	}

	# Read-back endpoint for uploaded files (for evaluator upload/retrieve checks)
	# GET /uploads/<filename> maps to ./uploads_eval/<filename>
	location /uploads
	{
		methods GET;
		root ./uploads_eval;
		autoindex on;
	}

	# CGI endpoint tests (GET/POST + faulty script handling)
	location /cgi-bin
	{
		methods GET POST;
		cgi_enabled on;
		cgi_ext .py .pl;
		autoindex off;
	}

	# DELETE endpoint: only DELETE allowed here.
	# Before eval, create www1/delete_me.txt.
	location /delete
	{
		methods DELETE;
		root ./www1;
		autoindex off;
	}
}

# ---------------------------------------------------------------------------
# Server B (Website B): different interface+port
# Demonstrates:
# - multiple listening sockets
# - different root/index served on a different interface:port
# ---------------------------------------------------------------------------
server
{
	# On Linux, any 127.x.y.z is loopback.
	# If your evaluator environment can't use 127.0.0.2, change to 127.0.0.1:8091.
	listen 127.0.0.2:8091;

	root ./www2;
	index home.html;
	client_max_body_size 1000000;
	error_page 404 /404.html;

	location /
	{
		methods GET;
		autoindex off;
	}
}
